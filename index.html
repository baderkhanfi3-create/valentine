<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💖</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
    }
    .container {
        text-align: center;
        color: white;
        text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        z-index: 2;
    }
    h1 {
        font-size: 3em;
        margin-bottom: 30px;
    }
    .valentine-button {
        background: #ff6f91;
        border: none;
        padding: 15px 30px;
        font-size: 1.2em;
        border-radius: 12px;
        cursor: pointer;
        margin: 10px;
        transition: transform 0.3s ease, background 0.3s ease;
    }
    .valentine-button:hover {
        transform: scale(1.1);
        background: #ff4971;
    }
    .message {
        margin-top: 30px;
        font-size: 1.5em;
        display: none;
        animation: fadeIn 2s forwards;
    }
    @keyframes fadeIn {
        from {opacity: 0;}
        to {opacity: 1;}
    }
    .heart {
        position: absolute;
        color: #ff1e56;
        font-size: 1.2em;
        animation: floatUp 4s linear forwards;
    }
    @keyframes floatUp {
        0% {transform: translateY(0) scale(1);}
        50% {transform: translateY(-200px) scale(1.2);}
        100% {transform: translateY(-400px) scale(0.8); opacity: 0;}
    }
</style>
</head>
<body>
<div class="container">
    <h1>Ch4rouq 7obi 😍 & Badr 💖</h1>
    <button class="valentine-button" onclick="accept()">Oui, je veux 💌</button>
    <button class="valentine-button" onclick="reject()">Non, désolé 😢</button>

    <div class="message" id="loveMessage">
        💖 Happy Valentine avec toi, ma chérie Ch4rouq! <br> De ton Badr 😘
    </div>
</div>

<script>
function createHeart() {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.innerText = '❤️';
    heart.style.left = Math.random() * window.innerWidth + 'px';
    heart.style.fontSize = (10 + Math.random() * 30) + 'px';
    document.body.appendChild(heart);
    setTimeout(() => {
        heart.remove();
    }, 4000);
}

function accept() {
    document.getElementById('loveMessage').style.display = 'block';
    // generate hearts every 300ms
    const heartInterval = setInterval(createHeart, 300);
    setTimeout(() => clearInterval(heartInterval), 5000); // stop after 5s
}

function reject() {
    location.reload();
}
</script>
</body>
</html>
