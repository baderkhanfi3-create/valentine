<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💖</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }
    .container {
        text-align: center;
        color: white;
        text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    }
    h1 {
        font-size: 3em;
        margin-bottom: 20px;
    }
    .valentine-button {
        background: #ff6f91;
        border: none;
        padding: 15px 30px;
        font-size: 1.2em;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.3s ease, background 0.3s ease;
    }
    .valentine-button:hover {
        transform: scale(1.1);
        background: #ff4971;
    }
</style>
</head>
<body>
<div class="container">
    <h1>Ch4rouq 7obi 😍 & Badr 💖</h1>
    <button class="valentine-button" onclick="showMessage()">Clique ici 💌</button>
</div>

<script>
function showMessage() {
    alert("Happy Valentine avec toi, ma chérie Ch4rouq! 💖\nDe ton Badr 😘");
}
</script>
</body>
</html>
